services:
  - type: web
    name: lissurary
    runtime: python
    plan: free # TODO: 실사용 전 starter로 되돌릴 것 (상시 실행 필요, docs/architecture.md 8번 참고)
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.14
      - key: SESSION_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: ADMINS_CSV_PATH
        value: /etc/secrets/admins.csv
